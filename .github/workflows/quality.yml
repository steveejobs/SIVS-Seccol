name: Qualidade e segurança

on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Instalar dependências e auditor
        run: python -m pip install --disable-pip-version-check -r requirements.txt pip-audit
      - name: Bloquear vulnerabilidades conhecidas
        run: python -m pip_audit -r requirements.txt --strict
      - name: Executar suíte integral
        run: python -m unittest discover -s sivs_2_2/tests -p "test_*.py" -v
      - name: Validar sintaxe Python
        run: python -m compileall -q sivs_2_2 tools
      - name: Validar sintaxe JavaScript
        shell: bash
        run: |
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find sivs_2_2/static -name '*.js' -print0)
          node --check tools/responsive_audit.mjs
      - name: Validar contratos e ferramentas seguras
        run: |
          python tools/optimize_images.py sivs_2_2/static --dry-run
          python tools/audit_plain_language.py

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
